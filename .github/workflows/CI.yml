name: CI

# No pull_request trigger (ticket 1174): the merge gate is local
# (scripts/local-ci.sh, which runs this file under workflow_dispatch). The push
# run is the ex-post record of main on a clean forge runner; workflow_dispatch
# runs it by hand on any branch. To run it on every pull request again, add
# `pull_request:` under `on:`. The PR-only collision check is in
# ticket-collision.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-tickets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate tickets
        run: chmod +x ./tickets/erg && ./tickets/erg check tickets/

  skill-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check SKILL.md frontmatter
        run: |
          fail=0
          for f in skills/*/SKILL.md; do
            front=$(sed -n '/^---$/,/^---$/p' "$f" | sed '1d;$d')
            if ! echo "$front" | grep -q '^name:'; then
              echo "FAIL: $f missing 'name:' in frontmatter"
              fail=1
            fi
            if ! echo "$front" | grep -q '^description:'; then
              echo "FAIL: $f missing 'description:' in frontmatter"
              fail=1
            fi
          done
          exit $fail

  agnostic-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for consumer-project assumptions in skills, tickets, and scripts
        run: bash scripts/check-agnostic.sh
      - name: Self-test — script must catch a deliberate violation
        run: |
          tmp=$(mktemp -d)
          mkdir -p "$tmp/skills"
          echo '/home/someuser/projects/SomeProject' > "$tmp/skills/SKILL.md"
          if bash scripts/check-agnostic.sh "$tmp/skills"; then
            echo "FAIL: agnostic-guard did not catch the deliberate violation"
            exit 1
          fi
          echo "OK: deliberate violation caught"
      - name: Self-test — escape hatch must suppress a violation
        run: |
          tmp=$(mktemp -d)
          mkdir -p "$tmp/skills"
          echo '<!-- harness-extension-point --> /home/someuser/projects/SomeProject' > "$tmp/skills/SKILL.md"
          if ! bash scripts/check-agnostic.sh "$tmp/skills"; then
            echo "FAIL: escape hatch did not suppress the violation"
            exit 1
          fi
          echo "OK: escape hatch suppressed violation"

  status-verb-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No legacy status verb in skill log examples
        run: bash scripts/check-status-verb.sh
      - name: Self-test — guard must catch a deliberate violation
        run: |
          tmp=$(mktemp -d)
          mkdir -p "$tmp/skills/fake"
          echo '2026-05-01T10:00Z claude status closed — done' > "$tmp/skills/fake/SKILL.md"
          if bash scripts/check-status-verb.sh "$tmp/skills"; then
            echo "FAIL: guard did not catch the deliberate violation"
            exit 1
          fi
          echo "OK: deliberate violation caught"
      - name: Self-test — guard must pass on clean file
        run: |
          tmp=$(mktemp -d)
          mkdir -p "$tmp/skills/fake"
          echo '2026-05-01T10:00Z claude closed — done' > "$tmp/skills/fake/SKILL.md"
          if ! bash scripts/check-status-verb.sh "$tmp/skills"; then
            echo "FAIL: guard reported false positive on clean file"
            exit 1
          fi
          echo "OK: guard passes clean file"
      - name: Self-test — guard must not false-positive on substring match
        run: |
          tmp=$(mktemp -d)
          mkdir -p "$tmp/skills/fake"
          echo 'check status openings for this quarter' > "$tmp/skills/fake/SKILL.md"
          if ! bash scripts/check-status-verb.sh "$tmp/skills"; then
            echo "FAIL: guard false-positived on substring 'status openings'"
            exit 1
          fi
          echo "OK: guard ignores substring matches"

  personal-data-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No tier-2 personal data (access topology) in the tree
        run: bash scripts/check-personal-data.sh
      - name: Self-test — guard must catch a deliberate violation
        run: |
          tmp=$(mktemp -d)
          v="ods"
          echo "Login: minh.ha-duong@${v}.services" > "$tmp/x.md"
          if bash scripts/check-personal-data.sh "$tmp/x.md"; then
            echo "FAIL: personal-data-guard did not catch the deliberate violation"
            exit 1
          fi
          echo "OK: deliberate violation caught"
      - name: Self-test — guard must not false-positive on msmtp.log
        run: |
          tmp=$(mktemp -d)
          echo 'check ~/.msmtp.log for delivery errors' > "$tmp/y.md"
          if ! bash scripts/check-personal-data.sh "$tmp/y.md"; then
            echo "FAIL: false positive on msmtp.log mention"
            exit 1
          fi
          echo "OK: no false positive"
      - name: Self-test — guard must not flag its own pattern file or CI fixtures
        run: |
          if ! bash scripts/check-personal-data.sh scripts/check-personal-data.sh .github/workflows/CI.yml; then
            echo "FAIL: guard flags itself"
            exit 1
          fi
          echo "OK: no self-match"

  pipefail-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: All hook scripts must have set -euo pipefail
        run: bash scripts/check-pipefail.sh
      - name: Self-test — guard must catch a script without pipefail
        run: |
          tmp=$(mktemp --suffix=.sh)
          echo '#!/bin/bash' > "$tmp"
          echo 'echo hello' >> "$tmp"
          rc=0; bash scripts/check-pipefail.sh "$tmp" || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "FAIL: guard did not catch missing pipefail (exit $rc, want 1)"
            exit 1
          fi
          echo "OK: guard catches missing pipefail"
      - name: Self-test — guard must pass when all scripts are compliant
        run: |
          tmp=$(mktemp --suffix=.sh)
          echo '#!/bin/bash' > "$tmp"
          echo 'set -euo pipefail' >> "$tmp"
          echo 'echo hello' >> "$tmp"
          if ! bash scripts/check-pipefail.sh "$tmp"; then
            echo "FAIL: guard reported false positive on compliant script"
            exit 1
          fi
          echo "OK: guard passes compliant script"

  grep-e-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No grep -E/-G with PCRE character escapes in hook scripts
        run: |
          violations=$(grep -Pn '(?=.*\bgrep\b)(?=.*-[a-zA-Z]*[EG])(?=.*\\[bsw])' scripts/*.sh 2>/dev/null || true)
          if [ -n "$violations" ]; then
            echo "FAIL: grep -E/-G used with PCRE escapes (\\b/\\s/\\w) — use grep -P instead:"
            echo "$violations"
            exit 1
          fi
          echo "OK: no grep -E/-G with PCRE character escapes found"
      - name: Self-test — guard must catch a deliberate violation
        run: |
          tmp=$(mktemp --suffix=.sh)
          printf '%s\n' '#!/bin/bash' 'set -euo pipefail' "grep -qE '\\bfoo\\b' file" > "$tmp"
          violations=$(grep -Pn '(?=.*\bgrep\b)(?=.*-[a-zA-Z]*[EG])(?=.*\\[bsw])' "$tmp" 2>/dev/null || true)
          if [ -z "$violations" ]; then
            echo "FAIL: guard did not catch grep -E with PCRE escape"
            exit 1
          fi
          echo "OK: deliberate violation caught"
      - name: Self-test — guard must pass on clean script
        run: |
          tmp=$(mktemp --suffix=.sh)
          printf '%s\n' '#!/bin/bash' 'set -euo pipefail' "grep -qP '\\bfoo\\b' file" > "$tmp"
          violations=$(grep -Pn '(?=.*\bgrep\b)(?=.*-[a-zA-Z]*[EG])(?=.*\\[bsw])' "$tmp" 2>/dev/null || true)
          if [ -n "$violations" ]; then
            echo "FAIL: guard false-positived on grep -P (which is correct)"
            exit 1
          fi
          echo "OK: guard passes clean script"

  tab-ifs-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No IFS=$'\t' read with 3+ fields in shell scripts
        # Tab is IFS *whitespace*: consecutive tabs collapse, so an empty
        # middle field silently shifts later fields left (bit reviewers.sh
        # roster parsing, 2026-07-13). Two-field reads are safe (an empty
        # field can only be last); three or more need a non-whitespace
        # delimiter like | or ;. See rules/coding-bash.md.
        run: |
          violations=$(grep -Pn "IFS=\\\$'\\\\t'\\s+read\\s+(-\\w+\\s+)*(\\w+\\s+){2,}\\w+" scripts/*.sh skills/*/*.sh 2>/dev/null || true)
          if [ -n "$violations" ]; then
            echo "FAIL: tab-delimited read with 3+ fields — empty middle fields collapse; use IFS='|' (rules/coding-bash.md):"
            echo "$violations"
            exit 1
          fi
          echo "OK: no 3+-field tab-delimited reads found"
      - name: Self-test — guard must catch a deliberate violation
        run: |
          tmp=$(mktemp --suffix=.sh)
          printf '%s\n' '#!/bin/bash' "while IFS=\$'\\t' read -r a b c; do :; done < f" > "$tmp"
          violations=$(grep -Pn "IFS=\\\$'\\\\t'\\s+read\\s+(-\\w+\\s+)*(\\w+\\s+){2,}\\w+" "$tmp" 2>/dev/null || true)
          if [ -z "$violations" ]; then
            echo "FAIL: guard did not catch 3-field tab read"
            exit 1
          fi
          echo "OK: deliberate violation caught"
      - name: Self-test — guard must pass 2-field and pipe-delimited reads
        run: |
          tmp=$(mktemp --suffix=.sh)
          printf '%s\n' '#!/bin/bash' "while IFS=\$'\\t' read -r name path; do :; done < f" "while IFS='|' read -r a b c d; do :; done < g" > "$tmp"
          violations=$(grep -Pn "IFS=\\\$'\\\\t'\\s+read\\s+(-\\w+\\s+)*(\\w+\\s+){2,}\\w+" "$tmp" 2>/dev/null || true)
          if [ -n "$violations" ]; then
            echo "FAIL: guard false-positived on safe reads"
            exit 1
          fi
          echo "OK: guard passes safe reads"

  pytest-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The /molt close regression runs the historical erg binary from
          # commit 51ee49c as well as the current binary.
          fetch-depth: 0
      # setup-uv publishes exact release tags only (no moving major tag).
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install dev dependencies
        # Declared in one place (pyproject.toml, locked in uv.lock) so CI and
        # a fresh machine read the same contract; tests/test_deps_declared.py
        # guards the list (ticket 0530). The env's bin goes first on PATH so
        # every later step's python3/pytest/ruff is the locked one.
        run: |
          uv sync --locked
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      # The shell-based regression suites in tests/*.sh are run under pytest via
      # tests/test_bash_suites.py; several of them build their payloads with jq.
      - name: Ensure jq is available
        run: jq --version
      # The memory-capture suites (ticket 0988) exercise the pinned age
      # encrypt/decrypt commands for real; on a host without age they skip.
      # A pinned release, checksum-verified: apt-get update cost ~8 s to fetch
      # every package index for one small binary. Bump version and sha256 together.
      - name: Ensure age is available
        env:
          AGE_VERSION: v1.3.2
          AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
        run: |
          curl -fsSL -o "$RUNNER_TEMP/age.tgz" \
            "https://github.com/FiloSottile/age/releases/download/$AGE_VERSION/age-$AGE_VERSION-linux-amd64.tar.gz"
          echo "$AGE_SHA256  $RUNNER_TEMP/age.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/age.tgz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/age/age" "$RUNNER_TEMP/age/age-keygen" /usr/local/bin/
          age --version && age-keygen --version
      # Permanent diagnostic print (ticket 0875): the hermeticity guard's scan
      # is a bash + awk + grep pipeline, and a red-green divergence between
      # runner and developer machines starts by knowing which versions ran.
      - name: Report text-tool versions
        run: |
          command -v awk grep bash
          awk --version 2>&1 | head -1 || true
          grep --version | head -1
          bash --version | head -1
      - name: Run test suite
        # Coverage was reported here but never gated, at a cost on every PR;
        # run it locally when wanted: pytest tests/ -n 4 --cov=scripts
        run: python3 -m pytest tests/ -v -n 4
