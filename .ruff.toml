# Lint ratchet of the harness repo (ticket 0470), enforced locally by
# tests/test_ruff.py under `make lint` and in CI through the pytest-guard job.
# Default rule set on purpose — the ratchet's job is to keep the tree clean,
# not to open a cleanup.
#
# No suppressions of any kind. Ticket 0470 grandfathered 9 pre-existing
# violations in `per-file-ignores` to land the gate without a cleanup; 0590
# fixed them and deleted the section. Every such entry was a hole: while one
# stands, a new violation it covers passes unseen.
# `tests/test_ruff.py::test_config_declares_no_suppressions` fails on ANY
# suppression key here — `per-file-ignores`, `ignore`, `exclude` and their
# `extend-` forms, at top level or under `[lint]` — so reopening a hole is a
# deliberate, argued change rather than a quiet one.
