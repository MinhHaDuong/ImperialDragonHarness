# Lint ratchet of the harness repo (ticket 0470), enforced locally by
# tests/test_ruff.py under `make lint` and in CI through the pytest-guard job.
# Default rule set on purpose — the ratchet's job is to keep the tree clean,
# not to open a cleanup.
#
# No `per-file-ignores`: the 9 violations 0470 grandfathered were cleaned in
# ticket 0590, so the whole section went with them. That matters beyond
# tidiness — every entry was a hole in which a NEW violation of the same rule
# in the same file passed unseen. `tests/test_ruff.py` carries a guard that
# fails on a grandfather entry whose violation no longer fires, so a future
# entry cannot outlive its reason the way these did.
